<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚礼流程表</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: linear-gradient(135deg, #fff5f5 0%, #ffe3e3 100%);
        min-height: 100vh; padding: 20px; color: #333;
    }
    .container { max-width: 1060px; margin: 0 auto; }
    h1 { text-align: center; color: #c0392b; margin-bottom: 8px; font-size: 26px; }
    .subtitle { text-align: center; color: #e67e22; margin-bottom: 20px; font-size: 14px; }

    /* 倒计时卡片 */
    .now-card {
        background: #fff; border-radius: 12px; padding: 15px 20px;
        box-shadow: 0 2px 8px rgba(192,57,43,.12); margin-bottom: 20px;
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .now-card .now-time { font-size: 26px; font-weight: bold; color: #c0392b; }
    .now-card .now-label { font-size: 13px; color: #888; }
    .now-card .next-item { font-size: 15px; color: #333; text-align: right; }
    .now-card .next-item b { color: #e67e22; }

    /* 表单 */
    .card {
        background: #fff; border-radius: 12px; padding: 20px;
        box-shadow: 0 2px 8px rgba(192,57,43,.12); margin-bottom: 20px;
    }
    .card h2 { font-size: 16px; color: #c0392b; margin-bottom: 15px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .form-row input, .form-row select {
        padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
        font-size: 14px; outline: none; flex: 1; min-width: 110px;
    }
    .form-row input:focus, .form-row select:focus { border-color: #e67e22; }
    #fTime { flex: 0 0 110px; min-width: 110px; }
    #fSide { flex: 0 0 110px; min-width: 110px; }
    .btn {
        padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer;
        font-size: 14px; font-weight: bold; transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-add { background: #c0392b; color: #fff; }
    .btn-save { background: #e67e22; color: #fff; }
    .btn-cancel { background: #fff; color: #888; border: 1px solid #ccc; }
    .btn-share { background: #2980b9; color: #fff; }
    .btn-import { background: #27ae60; color: #fff; }
    .btn-pdf { background: #8e44ad; color: #fff; }
    .btn-cloud { background: #16a085; color: #fff; }
    .btn-refresh { background: #f39c12; color: #fff; }
    .btn-token { background: #fff; color: #16a085; border: 1px solid #16a085; }
    .btn-admin { background: #fff; color: #7f8c8d; border: 1px solid #95a5a6; }
    .btn-clear { background: #fff; color: #c0392b; border: 1px solid #c0392b; }

    /* 双栏时间轴 */
    .columns { display: flex; gap: 20px; align-items: flex-start; }
    .col { flex: 1; min-width: 0; background: #fff; border-radius: 12px; padding: 20px;
        box-shadow: 0 2px 8px rgba(192,57,43,.12); }
    .col-groom { border-top: 4px solid #2980b9; }
    .col-bride { border-top: 4px solid #c0392b; }
    .col h2 { font-size: 17px; margin-bottom: 15px; }
    .col-groom h2 { color: #2980b9; }
    .col-bride h2 { color: #c0392b; }

    .timeline { list-style: none; }
    .tl-item {
        display: flex; gap: 14px; position: relative; padding-bottom: 18px;
    }
    .tl-item::before {  /* 竖线 */
        content: ""; position: absolute; left: 41px; top: 34px; bottom: 0;
        width: 2px; background: #fadbd8;
    }
    .tl-item:last-child::before { display: none; }
    .col-groom .tl-item::before { background: #d6eaf8; }
    .tl-time {
        flex: 0 0 70px; text-align: center; font-size: 15px; font-weight: bold;
        color: #c0392b; background: #fadbd8; border-radius: 8px;
        padding: 6px 0; height: fit-content;
    }
    .col-groom .tl-time { color: #2980b9; background: #d6eaf8; }
    .tl-body { flex: 1; background: #fff; border: 1px solid #f5dcd8; border-radius: 10px; padding: 10px 14px; position: relative; }
    .col-groom .tl-body { border-color: #d6eaf8; }
    .tl-title { font-size: 15px; font-weight: bold; }
    .tl-remark { font-size: 13px; color: #888; margin-top: 4px; }
    .tl-gap { font-size: 12px; color: #bbb; margin-top: 6px; }
    .tl-actions { position: absolute; right: 12px; top: 10px; font-size: 13px; }
    .tl-actions .edit-link { color: #2980b9; cursor: pointer; margin-right: 8px; }
    .tl-actions .del-link { color: #c0392b; cursor: pointer; }

    /* 状态标记 */
    .tl-item.done .tl-time { background: #eee !important; color: #aaa !important; }
    .tl-item.done .tl-body { opacity: .55; }
    .tl-item.current .tl-body { border-color: #e67e22; box-shadow: 0 0 0 2px rgba(230,126,34,.25); }
    .tl-item.current .tl-title::after {
        content: "● 进行中"; color: #e67e22; font-size: 12px; font-weight: normal; margin-left: 8px;
    }
    .empty-tip { text-align: center; color: #aaa; padding: 30px 0; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .toolbar h2 { margin-bottom: 0; }
    .toolbar > div { display: flex; gap: 8px; flex-wrap: wrap; }

    @media (max-width: 900px) {
        /* 手机端：两栏上下堆叠 */
        .columns { flex-direction: column; }
    }
    @media (max-width: 640px) {
        body { padding: 12px; }
        h1 { font-size: 22px; }
        .col, .card { padding: 14px; }
        .form-row input, .form-row select { min-width: 100%; }
        #fTime { min-width: 45%; flex: 0 0 45%; }
        #fSide { min-width: 45%; flex: 0 0 45%; }
        .form-row .btn { flex: 1; padding: 10px 8px; }
        .toolbar { flex-direction: column; align-items: stretch; }
        .toolbar h2 { text-align: center; }
        .toolbar .btn { flex: 1; padding: 10px 6px; font-size: 13px; }
        .tl-item::before { left: 36px; }
        .tl-time { flex: 0 0 60px; font-size: 13px; }
        .now-card .next-item { text-align: left; }
        /* 手机端：操作按钮改为独立一行，避免与标题重叠 */
        .tl-actions {
            position: static; text-align: right; margin-top: 8px;
            padding-top: 8px; border-top: 1px dashed #f0e0dc;
        }
        .tl-actions .edit-link, .tl-actions .del-link {
            font-size: 14px; padding: 4px 8px;
        }
        .tl-actions .edit-link { margin-right: 0; }
    }
    </style>
</head>
<body>
<div class="container">
    <h1>💒 婚礼流程表</h1>
    <div class="subtitle">新郎新娘双时间轴 · 数据云端同步（GitHub）· 支持导出图片</div>
    <div style="text-align:center; font-size:12px; color:#999; margin:-12px 0 16px;" id="cloudStatus">数据源：本地</div>

    <div class="now-card">
        <div>
            <div class="now-label">当前时间</div>
            <div class="now-time" id="nowTime">--:--</div>
        </div>
        <div class="next-item" id="nextItem">加载中…</div>
    </div>

    <div class="card">
        <h2>📝 添加流程节点</h2>
        <div class="form-row">
            <select id="fSide">
                <option value="bride">新娘</option>
                <option value="groom">新郎</option>
            </select>
            <input type="time" id="fTime" value="06:00">
            <input type="text" id="fName" placeholder="事项名称，如：出发接亲">
            <input type="text" id="fRemark" placeholder="备注（可选），如：4个堵门游戏">
            <button class="btn btn-add" id="btnAdd" onclick="addItem()">添加</button>
            <button class="btn btn-save" id="btnSave" style="display:none" onclick="saveEdit()">保存修改</button>
            <button class="btn btn-cancel" id="btnCancel" style="display:none" onclick="cancelEdit()">取消</button>
        </div>
    </div>

    <div class="card">
        <div class="toolbar">
            <h2>📖 当天流程</h2>
            <div>
                <button class="btn btn-cloud" id="btnCloud" style="display:none" onclick="saveToCloud()">☁️ 保存到云端</button>
                <button class="btn btn-refresh" onclick="initFromCloud(true)">🔄 刷新云端</button>
                <button class="btn btn-admin" id="btnAdmin" onclick="toggleAdmin()">🛡️ 管理员登录</button>
                <button class="btn btn-token" id="btnToken" style="display:none" onclick="configToken()">🔑 令牌管理</button>
                <button class="btn btn-pdf" id="btnPdf" onclick="exportImage()">🖼️ 导出图片</button>
                <button class="btn btn-share" onclick="shareCode()">🔗 生成分享链接</button>
                <button class="btn btn-import" onclick="importData()">📥 导入</button>
            </div>
        </div>
        <div class="columns" id="printArea">
            <div class="col col-bride">
                <h2>👰 新娘流程</h2>
                <ul class="timeline" id="timelineBride"></ul>
                <div class="empty-tip" id="emptyTipBride">暂无流程节点</div>
            </div>
            <div class="col col-groom">
                <h2>🤵 新郎流程</h2>
                <ul class="timeline" id="timelineGroom"></ul>
                <div class="empty-tip" id="emptyTipGroom">暂无流程节点</div>
            </div>
        </div>
        <input type="file" id="importFile" accept=".json,.txt" style="display:none" onchange="onImportFile(this)">
    </div>
</div>

<script>
const STORAGE_KEY = "wedding_schedule_v2";
const SIDES = { bride: "新娘", groom: "新郎" };

// 默认流程（可自由增删改）
const DEFAULT_ITEMS = [
    // 新娘
    { side: "bride", time: "05:00", name: "新娘起床洗漱", remark: "早餐简单吃一点" },
    { side: "bride", time: "05:30", name: "化妆师到位，开始化妆", remark: "头饰、妆容约 2 小时" },
    { side: "bride", time: "07:00", name: "伴娘就位，准备堵门", remark: "4 个堵门游戏道具就绪" },
    { side: "bride", time: "07:50", name: "出门仪式、拜别父母", remark: "敬茶、红伞、换鞋" },
    { side: "bride", time: "09:00", name: "到达新房", remark: "进门仪式、敬茶改口" },
    { side: "bride", time: "09:30", name: "出发前往酒店", remark: "" },
    { side: "bride", time: "10:58", name: "婚礼仪式开始", remark: "吉时" },
    // 新郎
    { side: "groom", time: "05:30", name: "新郎起床着装", remark: "胸花、红包清点" },
    { side: "groom", time: "06:00", name: "婚车队伍集合出发", remark: "路线、红包带齐" },
    { side: "groom", time: "06:50", name: "到达女方家", remark: "" },
    { side: "groom", time: "07:00", name: "接亲堵门游戏", remark: "共 4 个游戏，约 1 小时" },
    { side: "groom", time: "07:50", name: "接亲完成，出发回新房", remark: "车程约 70 分钟" },
    { side: "groom", time: "09:00", name: "到达新房", remark: "" },
    { side: "groom", time: "09:30", name: "出发前往酒店", remark: "" },
    { side: "groom", time: "10:58", name: "婚礼仪式开始", remark: "吉时" }
];

let items = loadItems();
let editingId = null;

render();
setInterval(tickNow, 1000);
// 打开时若链接带有分享数据，自动询问导入
window.addEventListener("hashchange", checkHash);
checkHash();
// 线上部署时，从云端拉取最新数据
initFromCloud();

window.addEventListener("storage", e => {
    // 同一浏览器其他标签页修改时自动同步
    if (e.key === STORAGE_KEY) {
        items = loadItems();
        render();
    }
});

function loadItems() {
    try {
        const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(v) && v.length) return normalizeItems(v);
    } catch (e) { /* 忽略损坏数据 */ }
    return JSON.parse(JSON.stringify(DEFAULT_ITEMS)).map(x => ({ id: Date.now() + Math.random(), ...x }));
}

function normalizeItems(arr) {
    return arr.map(x => ({
        id: x.id || Date.now() + Math.random(),
        side: x.side === "groom" ? "groom" : "bride",
        time: x.time || "00:00",
        name: x.name || "",
        remark: x.remark || ""
    }));
}

function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

// ========== 增删改 ==========
function addItem() {
    const time = document.getElementById("fTime").value;
    const name = document.getElementById("fName").value.trim();
    if (!time) { alert("请选择时间"); return; }
    if (!name) { alert("请填写事项名称"); return; }

    items.push({
        id: Date.now(),
        side: document.getElementById("fSide").value,
        time: time,
        name: name,
        remark: document.getElementById("fRemark").value.trim()
    });
    saveItems();
    render();
    document.getElementById("fName").value = "";
    document.getElementById("fRemark").value = "";
}

function startEdit(id) {
    const it = items.find(x => x.id === id);
    if (!it) return;
    editingId = id;
    document.getElementById("fSide").value = it.side;
    document.getElementById("fTime").value = it.time;
    document.getElementById("fName").value = it.name;
    document.getElementById("fRemark").value = it.remark || "";
    document.getElementById("btnAdd").style.display = "none";
    document.getElementById("btnSave").style.display = "";
    document.getElementById("btnCancel").style.display = "";
    render();
}

function saveEdit() {
    const it = items.find(x => x.id === editingId);
    if (!it) { cancelEdit(); return; }
    const time = document.getElementById("fTime").value;
    const name = document.getElementById("fName").value.trim();
    if (!time) { alert("请选择时间"); return; }
    if (!name) { alert("请填写事项名称"); return; }
    it.side = document.getElementById("fSide").value;
    it.time = time;
    it.name = name;
    it.remark = document.getElementById("fRemark").value.trim();
    saveItems();
    cancelEdit();
    render();
}

function cancelEdit() {
    editingId = null;
    document.getElementById("btnAdd").style.display = "";
    document.getElementById("btnSave").style.display = "none";
    document.getElementById("btnCancel").style.display = "none";
    document.getElementById("fName").value = "";
    document.getElementById("fRemark").value = "";
    render();
}

function deleteItem(id) {
    if (!confirm("确定删除这个流程节点吗？")) return;
    items = items.filter(x => x.id !== id);
    if (editingId === id) cancelEdit();
    saveItems();
    render();
}



// ========== 渲染 ==========
function sortedBy(side) {
    return items.filter(x => x.side === side).sort((a, b) => a.time.localeCompare(b.time));
}

function toMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
}

function renderSide(side, ulId, emptyTipId) {
    const ul = document.getElementById(ulId);
    const list = sortedBy(side);
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();

    ul.innerHTML = list.map((it, i) => {
        const gap = i > 0 ? toMinutes(it.time) - toMinutes(list[i - 1].time) : null;
        const gapText = gap !== null && gap > 0 ? `距上一节点 ${Math.floor(gap / 60) ? Math.floor(gap / 60) + "小时" : ""}${gap % 60 ? (gap % 60) + "分钟" : ""}` : "";
        const isDone = toMinutes(it.time) < nowMin;
        const isCurrent = i < list.length - 1
            ? toMinutes(it.time) <= nowMin && nowMin < toMinutes(list[i + 1].time)
            : toMinutes(it.time) <= nowMin;
        const cls = isCurrent ? "current" : (isDone ? "done" : "");
        return `<li class="tl-item ${cls}">
            <div class="tl-time">${it.time}</div>
            <div class="tl-body">
                <div class="tl-title">${escapeHtml(it.name)}</div>
                ${it.remark ? `<div class="tl-remark">${escapeHtml(it.remark)}</div>` : ""}
                ${gapText ? `<div class="tl-gap">⏱ ${gapText}</div>` : ""}
                <div class="tl-actions">
                    <span class="edit-link" onclick="startEdit(${it.id})">编辑</span>
                    <span class="del-link" onclick="deleteItem(${it.id})">删除</span>
                </div>
            </div>
        </li>`;
    }).join("");
    document.getElementById(emptyTipId).style.display = list.length ? "none" : "block";
}

function render() {
    renderSide("bride", "timelineBride", "emptyTipBride");
    renderSide("groom", "timelineGroom", "emptyTipGroom");
    tickNow();
}

// ========== 当前时间 / 下一节点 ==========
function tickNow() {
    const now = new Date();
    document.getElementById("nowTime").textContent =
        now.toTimeString().slice(0, 5);
    const list = [...items].sort((a, b) => a.time.localeCompare(b.time));
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const next = list.find(x => toMinutes(x.time) > nowMin);
    const cur = [...list].reverse().find(x => toMinutes(x.time) <= nowMin);
    const tag = x => `【${SIDES[x.side]}】`;
    let html;
    if (cur && next) {
        const diff = toMinutes(next.time) - nowMin;
        html = `正在：${tag(cur)}<b>${escapeHtml(cur.name)}</b><br>下一项：${next.time} ${tag(next)}${escapeHtml(next.name)}（还有 <b>${diff}</b> 分钟）`;
    } else if (next) {
        html = `下一项：${next.time} ${tag(next)}<b>${escapeHtml(next.name)}</b>（还有 <b>${toMinutes(next.time) - nowMin}</b> 分钟）`;
    } else if (cur) {
        html = `今日流程已全部结束 🎉`;
    } else {
        html = `暂无流程安排`;
    }
    document.getElementById("nextItem").innerHTML = html;
}

// ========== 导出图片 ==========
async function exportImage() {
    const btn = document.getElementById("btnPdf");
    btn.disabled = true;
    btn.textContent = "生成中…";
    const el = document.getElementById("printArea");
    // 记录导出前的状态，导出后恢复
    const doneItems = [];
    try {
        // 隐藏编辑/删除按钮，图片里不需要
        const actions = el.querySelectorAll(".tl-actions");
        actions.forEach(x => x.style.visibility = "hidden");
        // 临时去掉“已完成置灰”状态，保持原色不因时间变灰
        el.querySelectorAll(".tl-item.done").forEach(x => {
            doneItems.push(x);
            x.classList.remove("done");
        });

        const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });

        // 转成图片下载（长图，保持页面原有格式）
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = `婚礼流程表_${new Date().toISOString().slice(0, 10)}.png`;
        a.click();
    } catch (err) {
        alert("导出图片失败：" + err.message);
    } finally {
        // 恢复隐藏的按钮和置灰状态
        el.querySelectorAll(".tl-actions").forEach(x => x.style.visibility = "");
        doneItems.forEach(x => x.classList.add("done"));
        btn.disabled = false;
        btn.textContent = "🖼️ 导出图片";
    }
}

// ========== 分享链接 / 分享码 / 导入 ==========
// 线上部署后（GitHub Pages 等）可生成真实链接，对方点开即自动导入；
// 本地 file:// 打开时无公网地址，退化为分享码（复制文本粘贴导入）
function encodeItems() {
    return btoa(unescape(encodeURIComponent(JSON.stringify(items))));
}

function decodeItems(code) {
    // 去除微信等应用插入的换行/空格，避免 base64 被截断报错
    const clean = String(code).replace(/\s+/g, "");
    const arr = JSON.parse(decodeURIComponent(escape(atob(clean))));
    if (!Array.isArray(arr)) throw new Error("格式错误");
    return arr.map(x => ({ id: x.id || Date.now() + Math.random(), side: x.side || "bride", time: x.time, name: x.name, remark: x.remark || "" }));
}

// 从一段文本中提取分享数据：支持完整链接、HJLC1 分享码、纯 base64
function extractPayload(text) {
    text = String(text || "").trim();
    if (!text) throw new Error("内容为空");
    if (text.startsWith("HJLC1:")) return text.slice(6);
    // 完整分享链接（?d= 或 #d=）
    const um = text.match(/[?#]d=([^&\s]+)/);
    if (um) return decodeURIComponent(um[1]);
    // 纯 base64（可能带换行）
    if (/^[A-Za-z0-9+/=\s]+$/.test(text) && text.length > 40) return text;
    throw new Error("无法识别的内容");
}

// 链接带分享数据（?d= 或旧版 #d=）时自动弹出导入确认
function checkHash() {
    let payload = null;
    try { payload = new URLSearchParams(location.search).get("d"); } catch (e) { /* 旧浏览器 */ }
    if (!payload) {
        const m = location.hash.match(/^#d=(.+)$/);
        if (m) { try { payload = decodeURIComponent(m[1]); } catch (e) { payload = m[1]; } }
    }
    if (!payload) return;
    try {
        const imported = decodeItems(payload);
        if (confirm(`分享链接中包含 ${imported.length} 个流程节点，是否导入并覆盖当前流程？`)) {
            items = imported;
            saveItems();
            render();
        }
    } catch (e) {
        alert("分享链接数据无效（可能被聊天软件截断）。\n\n请改用「📥 导入」→ 粘贴对方发来的完整链接或分享码。");
    }
    history.replaceState(null, "", location.pathname);
}

function shareCode() {
    if (location.protocol === "file:") {
        // 本地文件：无公网地址，只能用分享码
        const code = "HJLC1:" + encodeItems();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(
                () => alert("当前是本地文件，已复制分享码。\n\n通过微信发给对方，对方打开网页版后点「📥 导入」粘贴即可。\n（若已部署到网上，重新点此按钮可生成直开链接）"),
                () => prompt("请手动复制分享码：", code)
            );
        } else {
            prompt("请手动复制分享码：", code);
        }
        return;
    }
    // 线上：生成直开链接（用 ?d= 查询参数，比 #锚点 更不易被聊天软件丢弃）
    const url = location.origin + location.pathname + "?d=" + encodeURIComponent(encodeItems());
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(
            () => alert("分享链接已复制！\n\n发给对方（微信/QQ均可），点开即可自动加载这份流程。\n\n若对方点开后没反应（链接被截断），可让他点「📥 导入」粘贴这条完整链接。"),
            () => prompt("请手动复制分享链接：", url)
        );
    } else {
        prompt("请手动复制分享链接：", url);
    }
}

function importData() {
    const mode = prompt(
        "请选择导入方式：\n\n" +
        "输入 1 = 粘贴分享链接 / 分享码（推荐）\n" +
        "输入 2 = 选择 JSON 文件\n\n" +
        "（直接点取消则不导入）", "1");
    if (mode === "1") {
        const code = prompt("请粘贴对方发来的分享链接（含 ?d= 的一长串网址）\n或分享码（HJLC1: 开头）：");
        if (!code) return;
        try {
            const imported = decodeItems(extractPayload(code));
            if (confirm(`解析到 ${imported.length} 个流程节点，是否覆盖当前流程？`)) {
                items = imported;
                saveItems();
                render();
                alert("导入成功！");
            }
        } catch (e) {
            alert("导入失败：" + e.message + "\n\n请确认粘贴的是完整内容（微信传输可能截断长文本）。" );
        }
    } else if (mode === "2") {
        document.getElementById("importFile").click();
    }
}

function onImportFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
        try {
            let imported;
            const text = String(e.target.result);
            if (text.trim().startsWith("HJLC1:") || /[?#]d=/.test(text)) {
                imported = decodeItems(extractPayload(text));
            } else {
                const arr = JSON.parse(text);
                if (!Array.isArray(arr)) throw new Error("格式错误");
                imported = arr.map(x => ({ id: x.id || Date.now() + Math.random(), side: x.side || "bride", time: x.time, name: x.name, remark: x.remark || "" }));
            }
            items = imported;
            saveItems();
            render();
            alert(`导入成功，共 ${items.length} 个流程节点`);
        } catch (err) {
            alert("导入失败：" + err.message);
        } finally {
            input.value = "";
        }
    };
    reader.readAsText(file);
}

// ========== 云端同步（GitHub data.json） ==========
// 所有设备打开页面时拉取仓库里的 data.json，保存时通过 GitHub API 写回，
// 从而实现多端看到同一份数据。
// 读取无需任何凭证；写入需要一个 GitHub Personal Access Token（只存在发布者自己的浏览器里，不会写进仓库）
const TOKEN_KEY = "wedding_gh_token";
const MGR_KEY = "wedding_is_manager";

function tokenHelp(repo) {
    return "获取 GitHub 令牌（只需一次）：\n\n" +
        "1. 打开 https://github.com/settings/tokens?type=beta\n" +
        "2. Generate new token → 名称随意，如 wedding\n" +
        "3. Repository access 选 Only select repositories → 选中 " + repo + "\n" +
        "4. Permissions → Repository permissions → Contents 选 Read and write\n" +
        "5. 生成后复制粘贴到下面：";
}

// ========== 管理员模式：只有持有有效令牌的设备能发布到云端 ==========
function isManager() {
    return localStorage.getItem(MGR_KEY) === "1" && localStorage.getItem(TOKEN_KEY);
}

function updateManagerUI() {
    const mgr = isManager();
    document.getElementById("btnCloud").style.display = mgr ? "" : "none";
    document.getElementById("btnToken").style.display = mgr ? "" : "none";
    const admin = document.getElementById("btnAdmin");
    admin.style.display = "";
    admin.textContent = mgr ? "🚪 退出管理员" : "🛡️ 管理员登录";
}

async function toggleAdmin() {
    if (isManager()) {
        if (!confirm("退出管理员模式？（会同时清除本机保存的令牌）")) return;
        localStorage.removeItem(MGR_KEY);
        localStorage.removeItem(TOKEN_KEY);
        updateManagerUI();
        return;
    }
    const ci = cloudInfo();
    if (!ci) {
        alert("本地文件无法使用管理员功能。\n\n请打开线上地址：\nhttps://cserviceimpl.github.io/htmlView/");
        return;
    }
    const token = prompt(
        "管理员登录（仅婚礼流程发布人需要）：\n\n" +
        "其他亲友无需登录，可本地编辑后点「🔗 生成分享链接」发给管理员汇总。\n\n" +
        tokenHelp(ci.repo)
    );
    if (!token || !token.trim()) return;
    try {
        // 用仓库信息接口验证令牌及其写入权限
        const res = await fetch(`https://api.github.com/repos/${ci.owner}/${ci.repo}`, {
            headers: { Authorization: "Bearer " + token.trim(), Accept: "application/vnd.github+json" }
        });
        if (!res.ok) throw new Error("令牌验证失败 HTTP " + res.status);
        const data = await res.json();
        if (!data.permissions || !data.permissions.push) throw new Error("该令牌没有此仓库的写入权限，请按提示勾选 Contents: Read and write");
        localStorage.setItem(TOKEN_KEY, token.trim());
        localStorage.setItem(MGR_KEY, "1");
        updateManagerUI();
        alert("管理员登录成功！\n\n现在可以点「☁️ 保存到云端」发布流程，其他人刷新即可看到。");
    } catch (e) {
        alert("管理员登录失败：" + e.message);
    }
}

// 根据管理员状态初始化按钮显示
updateManagerUI();

// 独立的令牌配置入口（仅管理员可见）
function configToken() {
    const ci = cloudInfo();
    if (!ci) return;
    const cur = localStorage.getItem(TOKEN_KEY);
    const tip = cur
        ? "已配置令牌（" + cur.slice(0, 8) + "…）\n\n留空点确定 = 清除已保存的令牌；否则输入新令牌替换。"
        : tokenHelp(ci.repo);
    let token = prompt(tip, "");
    if (token === null) return;  // 点了取消，不动
    token = token.trim();
    if (!token) {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(MGR_KEY);
        updateManagerUI();
        alert("已清除本机保存的令牌");
    } else {
        localStorage.setItem(TOKEN_KEY, token);
        alert("令牌已保存到本机浏览器（仅自己可见，不会泄露）。\n\n现在可以点「☁️ 保存到云端」发布流程了。");
    }
}

function cloudInfo() {
    // 仅在 github.io 部署环境下启用；owner 取自主机名，repo 取自路径
    const hm = location.host.match(/^([^.]+)\.github\.io$/i);
    if (!hm) return null;
    const pm = location.pathname.match(/^\/?([^\/]+)/);
    if (!pm) return null;
    return { owner: hm[1], repo: pm[1] };
}

async function initFromCloud(manual) {
    const ci = cloudInfo();
    if (!ci) return;
    const status = document.getElementById("cloudStatus");
    try {
        // 时间戳参数绕过 CDN 缓存，确保每次读到最新
        const url = `data.json?t=${Date.now()}`;
        const res = await fetch(url);
        if (res.status === 404) {
            status.textContent = "云端暂无 data.json，当前为本地数据（点「保存到云端」可发布）";
            return;
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) throw new Error("数据格式错误");
        items = normalizeItems(arr);
        saveItems();  // 同步一份到本地作为备份
        render();
        status.textContent = "数据源：云端（" + items.length + " 个节点，更新于 " + new Date().toLocaleTimeString() + "）";
    } catch (e) {
        status.textContent = "云端数据加载失败，当前为本地数据";
        if (manual) alert("刷新云端失败：" + e.message);
    }
}

async function saveToCloud() {
    const ci = cloudInfo();
    if (!ci) {
        alert("本地文件无法保存到云端。请先按文档把页面部署到 GitHub Pages，再使用此功能。");
        return;
    }

    let token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
        token = prompt("首次保存需要 GitHub 访问令牌（Token），用于把流程数据写回仓库。\n\n" + tokenHelp(ci.repo));
        if (!token) return;
        token = token.trim();
        localStorage.setItem(TOKEN_KEY, token);
    }

    const btn = document.getElementById("btnCloud");
    btn.disabled = true;
    btn.textContent = "保存中…";
    try {
        const api = `https://api.github.com/repos/${ci.owner}/${ci.repo}/contents/data.json`;
        // 先查当前文件的 sha（更新文件必须携带）
        let sha = null;
        const res = await fetch(api, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" } });
        if (res.status === 200) {
            sha = (await res.json()).sha;
        } else if (res.status !== 404) {
            if (res.status === 401) localStorage.removeItem(TOKEN_KEY);
            throw new Error("读取云端文件失败 HTTP " + res.status + (res.status === 401 ? "（令牌无效，已清除，请重试）" : ""));
        }

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(items, null, 2))));
        const put = await fetch(api, {
            method: "PUT",
            headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
            body: JSON.stringify({
                message: "更新婚礼流程 " + new Date().toLocaleString("zh-CN"),
                content: content,
                sha: sha
            })
        });
        if (put.status === 401 || put.status === 403) {
            localStorage.removeItem(TOKEN_KEY);
            throw new Error("令牌无效或权限不足（需勾选 Contents: Read and write），已清除，请重新生成后再试");
        }
        if (!put.ok) throw new Error("HTTP " + put.status);

        document.getElementById("cloudStatus").textContent = "数据源：云端（" + items.length + " 个节点，已发布 " + new Date().toLocaleTimeString() + "）";
        alert("已保存到云端！\n\n其他设备刷新页面（或点「🔄 刷新云端」）即可看到最新流程。");
    } catch (e) {
        alert("云端保存失败：" + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "☁️ 保存到云端";
    }
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g,
        c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
